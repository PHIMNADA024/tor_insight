# Dependabot keeps third-party components up to date (see docs/dependency-management.md).
# Security updates are opened as soon as an advisory is published, regardless of this schedule;
# the weekly schedule below covers routine version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    open-pull-requests-limit: 10
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    open-pull-requests-limit: 10
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
